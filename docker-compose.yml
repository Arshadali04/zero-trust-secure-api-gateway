# ──────────────────────────────────────────────────────────────────────────────
# Zero Trust Secure API Gateway — Docker Compose
#
# Default:  docker compose up --build
#   Runs the gateway with SQLite + in-process rate limiting + embedded mock
#   backend. Open http://127.0.0.1:8000/frontend/index.html
#
# Full stack (PostgreSQL + Redis):  docker compose --profile full up --build
#   Runs the gateway wired to Postgres (DATABASE_URL) with Redis available
#   (used by optional integrations). Rate limiting stays in-process.
#
# OAuth secrets: pass as environment variables or mount a .env file, e.g.
#   GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... docker compose up -d
# ──────────────────────────────────────────────────────────────────────────────
services:
  gateway:
    build: .
    container_name: zero-trust-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # persist SQLite DB, geoip cache, logs
    environment:
      - GATEWAY_DEMO=1            # auto-start the mock backend service
      # Optional overrides — omit to use defaults from gateway/config.py
      # - SECRET_KEY=change-me-32-chars-min
      # - ENVIRONMENT=production
      # - GOOGLE_CLIENT_ID=
      # - GOOGLE_CLIENT_SECRET=
      # - GITHUB_CLIENT_ID=
      # - GITHUB_CLIENT_SECRET=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Optional full stack (not required by default) ──────────────────────────
  postgres:
    profiles: ["full"]
    image: postgres:15-alpine
    container_name: zero_trust_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zero_trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    container_name: zero_trust_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
