name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 gateway/ tests/ --max-line-length=120 --ignore=E501,W503,E203 --count

      - name: Check import order
        run: isort --check-only --diff gateway/ tests/

      - name: Type check
        run: mypy gateway/ --ignore-missing-imports --no-strict-optional

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Security scan (bandit)
        run: bandit -r gateway/ -ll -ii --exclude gateway/demo/

      - name: Check for secrets in code
        run: |
          ! grep -rn "GOCSPX\|client_secret.*=.*[a-f0-9]\{40\}" gateway/ .env* --include="*.py" --include="*.env" 2>/dev/null || true

      - name: Dependency vulnerability scan
        run: pip install -r requirements.txt && safety check --short-output
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=gateway --cov-report=xml --cov-report=term-missing --cov-fail-under=59.4

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zero-trust-gateway:ci .

      - name: Verify container starts
        run: |
          docker run -d --name gateway-test -p 8000:8000 zero-trust-gateway:ci
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop gateway-test
