# nginx/nginx.conf
# -----------------
# Reverse proxy + TLS termination for the Zero Trust API Gateway.
#
# Usage (development — self-signed cert):
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout certs/key.pem -out certs/cert.pem -subj "/CN=localhost"
#   docker compose up
#
# In docker-compose.yml add:
#   nginx:
#     image: nginx:1.25-alpine
#     ports: ["80:80", "443:443"]
#     volumes:
#       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#       - ./nginx/certs:/etc/nginx/certs:ro
#     depends_on: [gateway]

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;          # hide nginx version

    # ── Rate limiting at the proxy layer ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS reverse proxy ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (1 year — only enable once you have a real cert)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Proxy to the FastAPI gateway ──────────────────────────────────────
        location / {
            limit_req zone=api burst=50 nodelay;

            proxy_pass         http://gateway:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";   # WebSocket support

            proxy_read_timeout  60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout  60s;

            # Remove server header from upstream
            proxy_hide_header  X-Powered-By;
        }

        # ── Stricter rate limit on auth endpoints ─────────────────────────────
        location ~ ^/auth/(login|register|forgot-password) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://gateway:8000;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Block common scanner paths ────────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi)$ { return 404; }
        location ~ /\.                         { deny all; }
    }
}
