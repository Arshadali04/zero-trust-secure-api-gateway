<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Step-up authentication — Zero Trust Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #0a0e14;
      --bg2:          #0f1620;
      --bg3:          #131d2b;
      --accent:       #5b8cff;
      --alert:        #ff5d5d;
      --success:      #2dd4a0;
      --warning:      #ffb636;
      --text:         #f0f4ff;
      --muted:        rgba(240,244,255,0.55);
      --dim:          rgba(240,244,255,0.28);
      --glass:        rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --sans:         'Space Grotesk', sans-serif;
      --mono:         'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Canvas ───────────────────────────────────────────────────────────── */
    .scene-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .page-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .centered-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Auth card (glass panel) ──────────────────────────────────────────── */
    .auth-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      padding: 40px;
    }

    /* ── Lock icon ────────────────────────────────────────────────────────── */
    .stepup-lock {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: rgba(91,140,255,0.10);
      border: 1px solid rgba(91,140,255,0.22);
      margin: 0 auto 24px;
    }
    .stepup-lock svg {
      filter: drop-shadow(0 0 10px rgba(91,140,255,0.45));
    }

    /* ── Heading & description ────────────────────────────────────────────── */
    .stepup-heading {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }
    .stepup-desc {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    /* ── Risk badge ───────────────────────────────────────────────────────── */
    .risk-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255,93,93,0.08);
      border: 1px solid rgba(255,93,93,0.22);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--alert);
      margin: 0 auto 24px;
      width: fit-content;
      /* center it */
      display: flex;
      justify-content: center;
    }
    .risk-badge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-alert {
      background: var(--alert);
      box-shadow: 0 0 6px var(--alert);
      animation: dotBlink 1.8s ease-in-out infinite;
    }
    @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Alert banner ─────────────────────────────────────────────────────── */
    .alert-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
      border: 1px solid;
      margin-bottom: 16px;
    }
    .alert-error {
      background: rgba(255,93,93,0.08);
      color: var(--alert);
      border-color: rgba(255,93,93,0.25);
    }
    .alert-success {
      background: rgba(45,212,160,0.08);
      color: var(--success);
      border-color: rgba(45,212,160,0.25);
    }

    /* ── Form ─────────────────────────────────────────────────────────────── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder { color: var(--dim); }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,140,255,0.12);
    }

    /* ── TOTP input — large centered digit display ────────────────────────── */
    .totp-input {
      font-family: var(--mono);
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.45em;
      text-align: center;
      padding: 16px 14px 16px 24px; /* compensate letter-spacing on right */
      color: var(--accent);
      border-color: rgba(91,140,255,0.18);
    }
    .totp-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,140,255,0.14);
    }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .btn-primary {
      background: var(--accent);
      color: #0a0e14;
      box-shadow: 0 4px 16px rgba(91,140,255,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(91,140,255,0.4);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-full { width: 100%; }

    /* ── Sign out link ────────────────────────────────────────────────────── */
    .stepup-signout {
      text-align: center;
      margin-top: 20px;
    }
    .stepup-signout a {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .stepup-signout a:hover { color: var(--alert); }

    /* ── Ambient radial background ────────────────────────────────────────── */
    .centered-wrap::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 500px at 30% 20%, rgba(255,93,93,0.05), transparent 55%),
        radial-gradient(600px 400px at 70% 80%, rgba(91,140,255,0.06), transparent 55%);
    }

    /* ── Visually hidden (accessible labels) ─────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" class="scene-canvas"></canvas>

  <div class="page-wrap">
    <div class="centered-wrap">
      <div class="auth-card">

        <!-- Lock icon -->
        <div class="stepup-lock" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
               stroke="var(--accent)" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>

        <!-- Heading -->
        <h2 class="stepup-heading">Identity verification required</h2>

        <!-- Description -->
        <p class="stepup-desc">
          Your account risk level has exceeded the threshold for this action.
          Enter your authenticator code to continue.
        </p>

        <!-- Risk badge -->
        <div class="risk-badge-wrap">
          <div class="risk-badge">
            <span class="dot dot-alert"></span>
            Elevated risk detected
          </div>
        </div>

        <!-- Alert banner -->
        <div id="alertBanner" class="alert-banner" role="alert" aria-live="polite"></div>

        <!-- TOTP input -->
        <div class="form-group">
          <label class="form-label sr-only" for="totpCode">6-digit authenticator code</label>
          <input
            class="form-input totp-input"
            type="text"
            id="totpCode"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="000000"
            autofocus
            aria-label="6-digit authenticator code"
          >
        </div>

        <!-- Verify button -->
        <button class="btn btn-primary btn-full" id="verifyBtn">
          Verify identity
        </button>

        <!-- Sign out -->
        <div class="stepup-signout">
          <a href="#" id="signoutLink">Sign out instead</a>
        </div>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script type="module" src="js/pages/stepup.js"></script>
</body>
</html>
