<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Zero Trust Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem("token");if(!t)return;var p=t.split(".");if(p.length!==3)return;var b=p[1].replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(p[1].length/4)*4,"=");var pl=JSON.parse(atob(b));if(!pl.exp||Date.now()<pl.exp*1000)window.location.replace("dashboard.html");}catch(e){}})();</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <canvas id="bg-canvas" class="scene-canvas"></canvas>
  <div class="page-wrap">
    <div class="centered-wrap">
      <div class="auth-card panel">

        <div class="auth-header" style="text-align:center;margin-bottom:28px">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <h1 style="font-size:1.4rem;font-weight:700;margin-top:12px">Create account</h1>
          <p style="color:var(--muted);font-size:0.875rem;margin-top:6px">Zero Trust API Gateway</p>
        </div>

        <!-- Alert banner (shown inline within the card) -->
        <div
          id="alertBanner"
          class="alert-banner"
          style="position:relative;top:auto;right:auto;z-index:auto;width:100%;max-width:100%;margin:0 0 12px;animation:none;display:none"
          role="alert"
          aria-live="polite"
        ></div>

        <form class="form" id="registerForm">
          <div class="form-group">
            <label class="form-label" for="fullName">Full name</label>
            <input
              class="form-input"
              type="text"
              id="fullName"
              name="full_name"
              placeholder="Your name"
              autocomplete="name"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="you@company.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input
              class="form-input"
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
              >
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                <!-- SVG injected by register.js -->
              </button>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill" data-level="0"></div>
            </div>
            <div class="form-hint" id="strengthHint">Min 8 chars, upper+lower+digit+special</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <input
                class="form-input"
                type="password"
                id="confirmPassword"
                name="confirm_password"
                placeholder="Repeat password"
                autocomplete="new-password"
                required
              >
              <button type="button" class="pw-toggle" id="confirmPwToggle" aria-label="Show confirm password">
                <!-- SVG injected by register.js -->
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create account</button>
        </form>

        <p style="text-align:center;margin-top:20px;font-size:0.8rem;color:var(--dim)">
          Already have an account? <a href="login.html">Sign in</a>
        </p>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
