<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔐</div>
                <h1>Create Account</h1>
                <p>Join Zero Trust Gateway</p>
            </div>

            <form id="registerForm" class="auth-form" action="javascript:void(0)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="johndoe" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div class="oauth-divider">
                <span>Or sign up with</span>
            </div>

            <div class="oauth-buttons">
                <a href="http://localhost:8000/auth/oauth/login/google" class="oauth-btn google">
                    <span class="oauth-icon">🔍</span>
                    Google
                </a>
                <a href="http://localhost:8000/auth/oauth/login/github" class="oauth-btn github">
                    <span class="oauth-icon">🐙</span>
                    GitHub
                </a>
            </div>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                UI.showError("Passwords do not match");
                return;
            }

            if (!UI.validatePassword(password)) {
                UI.showError("Password must be at least 8 characters long");
                return;
            }

            try {
                await Auth.register(
                    document.getElementById("email").value,
                    document.getElementById("username").value,
                    password,
                    document.getElementById("fullName").value
                );
            } catch (err) {
                // Auth.register already calls UI.showError(...)
                console.error("Registration failed:", err);
            }
        });

        // Handle OAuth callback
        window.addEventListener("load", () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            const user = params.get("user");

            if (token) {
                localStorage.setItem("token", token);
                localStorage.setItem(
                    "user",
                    JSON.stringify({
                        email: user,
                        username: (user || "").split("@")[0],
                        full_name: (user || "").split("@")[0],
                    })
                );
                UI.showSuccess("OAuth signup successful!");
                setTimeout(() => {
                    window.location.href = "/frontend/dashboard.html";
                }, 1500);
            }
        });
    </script>
</body>
</html>
