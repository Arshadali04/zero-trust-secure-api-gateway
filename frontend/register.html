<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/auth.css?v=2">
    <!-- If already logged in, skip the register page instantly -->
    <script>
        (function () {
            var token = localStorage.getItem('token');
            if (!token) return;
            try {
                var parts = token.split('.');
                if (parts.length !== 3) return;
                var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                var padded = b64.padEnd(Math.ceil(b64.length / 4) * 4, '=');
                var payload = JSON.parse(atob(padded));
                if (!payload.exp || Date.now() < payload.exp * 1000) {
                    window.location.replace('dashboard.html');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔐</div>
                <h1>Create Account</h1>
                <p>Join Zero Trust Gateway</p>
            </div>

            <form id="registerForm" class="auth-form" action="javascript:void(0)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="johndoe" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" placeholder="••••••••" required 
                               style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                        <button type="button" id="togglePassword" 
                                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem;">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div style="position: relative;">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required
                               style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                        <button type="button" id="toggleConfirmPassword" 
                                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem;">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div class="oauth-divider">
                <span>Or sign up with</span>
            </div>

            <div class="oauth-buttons">
                <a href="http://localhost:8000/auth/oauth/login/google" class="oauth-btn google">
                    <span class="oauth-icon">🔍</span>
                    Google
                </a>
                <a href="http://localhost:8000/auth/oauth/login/github" class="oauth-btn github">
                    <span class="oauth-icon">🐙</span>
                    GitHub
                </a>
            </div>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/api.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/ui.js?v=2"></script>
    <script>
        // Toggle Password Visibility
        function setupToggle(inputId, buttonId) {
            const btn = document.getElementById(buttonId);
            const input = document.getElementById(inputId);
            btn.addEventListener("click", () => {
                if (input.type === "password") {
                    input.type = "text";
                    btn.textContent = "🙈";
                } else {
                    input.type = "password";
                    btn.textContent = "👁️";
                }
            });
        }
        setupToggle("password", "togglePassword");
        setupToggle("confirmPassword", "toggleConfirmPassword");

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                UI.showError("Passwords do not match");
                return;
            }

            if (!UI.validatePassword(password)) {
                UI.showError("Password must be at least 8 characters long");
                return;
            }

            try {
                await Auth.register(
                    document.getElementById("email").value,
                    document.getElementById("username").value,
                    password,
                    document.getElementById("fullName").value
                );
            } catch (err) {
                // Auth.register already calls UI.showError(...)
                console.error("Registration failed:", err);
            }
        });

        // Handle OAuth callback / already-logged-in redirect
        window.addEventListener("load", async () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            const user = params.get("user");

            if (token) {
                localStorage.setItem("token", token);
                localStorage.setItem(
                    "user",
                    JSON.stringify({
                        email: user,
                        username: (user || "").split("@")[0],
                        full_name: (user || "").split("@")[0],
                    })
                );
                UI.showSuccess("OAuth signup successful!");
                setTimeout(() => {
                    window.location.href = "/frontend/dashboard.html";
                }, 1500);
            }
        });
    </script>
</body>
</html>
