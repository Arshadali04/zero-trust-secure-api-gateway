<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🔐</span>
                Zero Trust Gateway
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li class="nav-user">
                    <span id="userName">User</span>
                    <button class="nav-link btn-logout" onclick="Auth.logout()">Logout</button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Welcome, <span id="userFullName">User</span>! 👋</h1>
            <p>Here's your dashboard overview</p>
        </header>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-icon">📊</div>
                <h3>API Status</h3>
                <p class="card-stat" id="apiStatus">Checking...</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">🔐</div>
                <h3>Authentication</h3>
                <p class="card-stat">Active</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">👤</div>
                <h3>Account Role</h3>
                <p class="card-stat" id="userRole">user</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">⏰</div>
                <h3>Last Login</h3>
                <p class="card-stat" id="lastLogin">Today</p>
            </div>
        </div>

        <section class="dashboard-section">
            <h2>Quick Actions</h2>
            <div class="actions-grid">
                <a href="profile.html" class="action-btn">
                    <span class="action-icon">👤</span>
                    <span>View Profile</span>
                </a>
                <a href="http://127.0.0.1:8000/docs" target="_blank" class="action-btn">
                    <span class="action-icon">📚</span>
                    <span>API Docs</span>
                </a>
                <button class="action-btn" onclick="Auth.logout()">
                    <span class="action-icon">🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </section>
    </div>

    <div id="notification" class="notification"></div>

    <!-- Load order: API → UI → Auth -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>

    <script>
        window.addEventListener("load", async function () {
            // requireAuth() checks isAuthenticated(); if invalid it redirects to login.html
            const user = await Auth.requireAuth();
            if (!user) return; // redirecting, nothing else to do

            document.getElementById("userName").textContent     = user.username  || "User";
            document.getElementById("userFullName").textContent = user.full_name || user.username || "User";
            document.getElementById("userRole").textContent     = user.role      || "user";

            try {
                const health = await API.getHealth();
                document.getElementById("apiStatus").textContent =
                    health && health.status === "healthy" ? "✅ Healthy" : "⚠️ Degraded";
            } catch (e) {
                document.getElementById("apiStatus").textContent = "❌ Offline";
            }
        });
    </script>
</body>

</html>
