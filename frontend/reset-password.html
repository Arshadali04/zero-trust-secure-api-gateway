<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/auth.css" />
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔐</div>
                <h1>Reset Password</h1>
                <p>Enter your new password below</p>
            </div>

            <form id="resetForm" class="auth-form" action="javascript:void(0)">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password"
                               placeholder="••••••••" required autocomplete="new-password" 
                               style="width: 100%; padding-right: 40px; box-sizing: border-box;" />
                        <button type="button" id="togglePassword" 
                                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem;">
                            👁️
                        </button>
                    </div>
                    <small style="display: block; margin-top: 0.5rem; color: #6b7280; font-size: 0.75rem;">
                        Must be 8+ chars, 1 uppercase, 1 lowercase, 1 digit, 1 special (!@#$%)
                    </small>
                </div>

                <button id="submitBtn" type="submit" class="btn btn-primary btn-block">
                    Update Password
                </button>
            </form>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            UI.showError("Invalid or missing reset token.");
            document.getElementById("submitBtn").disabled = true;
        }

        // Toggle Password Visibility
        document.getElementById("togglePassword").addEventListener("click", function () {
            const pwdInput = document.getElementById("password");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                this.textContent = "🙈";
            } else {
                pwdInput.type = "password";
                this.textContent = "👁️";
            }
        });

        document.getElementById("resetForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const new_password = document.getElementById("password").value;

            btn.disabled = true;
            btn.textContent = "Updating...";

            try {
                const payload = { token, new_password };
                await API.request("POST", "/auth/reset-password", payload);
                UI.showSuccess("Password reset successfully! Redirecting to login...");
                setTimeout(() => window.location.replace("login.html"), 2000);
            } catch (error) {
                // UI.showError handles the visual
                btn.disabled = false;
                btn.textContent = "Update Password";
            }
        });
    </script>
</body>

</html>
