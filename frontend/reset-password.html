<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reset password — Zero Trust Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #0a0e14;
      --bg2:          #0f1620;
      --bg3:          #131d2b;
      --accent:       #5b8cff;
      --alert:        #ff5d5d;
      --success:      #2dd4a0;
      --warning:      #ffb636;
      --text:         #f0f4ff;
      --muted:        rgba(240,244,255,0.55);
      --dim:          rgba(240,244,255,0.28);
      --glass:        rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --sans:         'Space Grotesk', sans-serif;
      --mono:         'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Canvas ───────────────────────────────────────────────────────────── */
    .scene-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .page-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .centered-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Auth card (glass panel) ──────────────────────────────────────────── */
    .auth-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      padding: 40px;
    }

    /* ── Brand ────────────────────────────────────────────────────────────── */
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }
    .auth-brand-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-brand-icon svg {
      filter: drop-shadow(0 0 8px rgba(91,140,255,0.55));
    }
    .accent-text { color: var(--accent); }

    /* ── Card heading ─────────────────────────────────────────────────────── */
    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-heading h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }
    .auth-heading p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Alert banner ─────────────────────────────────────────────────────── */
    .alert-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
      border: 1px solid;
      margin-bottom: 16px;
    }
    .alert-error {
      background: rgba(255,93,93,0.08);
      color: var(--alert);
      border-color: rgba(255,93,93,0.25);
    }
    .alert-success {
      background: rgba(45,212,160,0.08);
      color: var(--success);
      border-color: rgba(45,212,160,0.25);
    }

    /* ── Form ─────────────────────────────────────────────────────────────── */
    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder { color: var(--dim); }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,140,255,0.12);
    }
    .form-input.error {
      border-color: var(--alert);
      box-shadow: 0 0 0 3px rgba(255,93,93,0.08);
    }

    /* ── Password input with toggle ───────────────────────────────────────── */
    .input-wrap {
      position: relative;
    }
    .input-wrap .form-input {
      padding-right: 42px;
    }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--dim);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--accent); }
    .pw-toggle svg { display: block; }

    /* ── Strength bar ─────────────────────────────────────────────────────── */
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--bg3);
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .strength-fill[data-level="1"] { width: 25%; background: var(--alert);   }
    .strength-fill[data-level="2"] { width: 50%; background: var(--warning); }
    .strength-fill[data-level="3"] { width: 75%; background: var(--success); }
    .strength-fill[data-level="4"] { width: 100%; background: var(--success); }

    /* ── Hint text ────────────────────────────────────────────────────────── */
    .form-hint {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--dim);
      line-height: 1.4;
      margin-top: 2px;
    }

    /* ── Button ───────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .btn-primary {
      background: var(--accent);
      color: #0a0e14;
      box-shadow: 0 4px 16px rgba(91,140,255,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(91,140,255,0.4);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-full { width: 100%; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { opacity: 0.8; }

    /* ── Ambient radial background ────────────────────────────────────────── */
    .centered-wrap::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px 500px at 20% 25%, rgba(91,140,255,0.06), transparent 60%),
        radial-gradient(500px 400px at 80% 75%, rgba(45,212,160,0.04), transparent 55%);
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" class="scene-canvas"></canvas>

  <div class="page-wrap">
    <div class="centered-wrap">
      <div class="auth-card">

        <!-- Brand -->
        <a class="auth-brand" href="index.html">
          <span class="auth-brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                 stroke="var(--accent)" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          Zero<span class="accent-text">Trust</span>
        </a>

        <!-- Heading -->
        <div class="auth-heading">
          <h1>Reset password</h1>
          <p>Choose a strong new password for your account.</p>
        </div>

        <!-- Alert banner -->
        <div id="alertBanner" class="alert-banner" role="alert" aria-live="polite"></div>

        <!-- Form -->
        <form id="resetForm" class="form" action="javascript:void(0)" novalidate>

          <!-- New password -->
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="newPassword" name="newPassword"
                placeholder="••••••••" required autocomplete="new-password" autofocus>
              <button type="button" class="pw-toggle" id="toggleNew"
                      aria-label="Toggle new password visibility"></button>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill" data-level="0"></div>
            </div>
            <span class="form-hint">8+ chars · uppercase · number · special character</span>
          </div>

          <!-- Confirm password -->
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
                placeholder="••••••••" required autocomplete="new-password">
              <button type="button" class="pw-toggle" id="toggleConfirm"
                      aria-label="Toggle confirm password visibility"></button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            Set new password
          </button>
        </form>

        <!-- Back link -->
        <p class="auth-footer">
          Back to <a href="login.html">sign in</a>
        </p>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script type="module" src="js/pages/reset.js"></script>
</body>
</html>
