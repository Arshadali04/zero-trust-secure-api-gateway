<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/auth.css" />
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔐</div>
                <h1>Forgot Password</h1>
                <p>Enter your email to receive a reset link</p>
            </div>

            <form id="forgotForm" class="auth-form" action="javascript:void(0)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="your@email.com" required autocomplete="email" />
                </div>

                <button id="submitBtn" type="submit" class="btn btn-primary btn-block">
                    Send Reset Link
                </button>
            </form>

            <div class="auth-footer" style="margin-top: 1rem;">
                <p>Remember your password? <a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        document.getElementById("forgotForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const email = document.getElementById("email").value.trim();

            btn.disabled = true;
            btn.textContent = "Sending...";

            try {
                const response = await API.request("POST", "/auth/forgot-password", { email });
                UI.showSuccess("Success! Check your terminal logs for the reset link.");
            } catch (error) {
                // UI.showError handles the visual
            } finally {
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
            }
        });
    </script>
</body>

</html>
