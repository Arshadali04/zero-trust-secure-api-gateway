<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/auth.css" />
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔐</div>
                <h1>Login</h1>
                <p>Welcome back</p>
            </div>

            <!--
                IMPORTANT: no action="" attribute, no onsubmit="" attribute.
                The submit event is handled entirely by the JS below.
            -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="your@email.com" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password" />
                </div>

                <button id="loginBtn" type="submit" class="btn btn-primary btn-block">
                    Login
                </button>
            </form>

            <div class="oauth-divider"><span>Or continue with</span></div>

            <div class="oauth-buttons">
                <a href="http://127.0.0.1:8000/auth/oauth/login/google" class="oauth-btn google">
                    <span class="oauth-icon">🔍</span> Google
                </a>
                <a href="http://127.0.0.1:8000/auth/oauth/login/github" class="oauth-btn github">
                    <span class="oauth-icon">🐙</span> GitHub
                </a>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up here</a></p>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <!-- Load order: API → UI → Auth (each depends on the previous) -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ── On page load ────────────────────────────────────────────────────────
        window.addEventListener("load", async function () {

            // 1. Handle OAuth redirect (token in URL query string).
            //    If this is a plain login page load (no ?token=...) this returns false immediately.
            const wasOAuth = await Auth.handleOAuthCallback();
            if (wasOAuth) return; // navigation already triggered inside handleOAuthCallback

            // 2. If the user already has a valid token (e.g. navigated back after login),
            //    send them straight to the dashboard.
            if (Auth.isAuthenticated()) {
                window.location.replace("dashboard.html");
                return;
            }

            // 3. Wire up the email/password form.
            //    Using the "submit" event on the <form> means:
            //      - clicking the submit button triggers it
            //      - pressing Enter inside any input triggers it
            //      - the browser's built-in required-field validation runs first
            document.getElementById("loginForm").addEventListener("submit", async function (e) {
                e.preventDefault(); // stop native form submission (prevents the blink)

                const email    = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                // Disable the button while the request is in flight
                const btn = document.getElementById("loginBtn");
                btn.disabled = true;

                try {
                    await Auth.login(email, password);
                    // Auth.login calls finishLogin on success which navigates to dashboard.
                    // On failure it shows an error toast and returns false — we re-enable the button.
                } finally {
                    // Only re-enable if we're still on this page (i.e. login failed)
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
