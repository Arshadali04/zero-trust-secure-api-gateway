<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Zero Trust Gateway</title>
    <link rel="stylesheet" href="css/auth.css?v=2" />
    <!--
        ANTI-BLINK GUARD — runs synchronously before any paint.
        If the user already has a valid token, redirect instantly.
        This means the login page is NEVER rendered for logged-in users.
    -->
    <script>
        (function () {
            var token = localStorage.getItem('token');
            if (!token) return;
            // Check if it is an OAuth callback (has ?token= in URL) — let it through
            if (window.location.search.indexOf('token=') !== -1) return;
            try {
                var parts = token.split('.');
                if (parts.length !== 3) { localStorage.removeItem('token'); return; }
                var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                var padded = b64.padEnd(Math.ceil(b64.length / 4) * 4, '=');
                var payload = JSON.parse(atob(padded));
                if (!payload.exp || Date.now() < payload.exp * 1000) {
                    window.location.replace('dashboard.html?t=' + Date.now());
                }
            } catch (e) { /* ignore decode errors */ }
        })();
    </script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔐</div>
                <h1>Login</h1>
                <p>Welcome back</p>
            </div>

            <form id="loginForm" class="auth-form" action="javascript:void(0)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required
                        autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" placeholder="••••••••" required
                            autocomplete="current-password"
                            style="width: 100%; padding-right: 40px; box-sizing: border-box;" />
                        <button type="button" id="togglePassword"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem;">
                            👁️
                        </button>
                    </div>
                    <div style="text-align: right; margin-top: 0.5rem;">
                        <a href="forgot-password.html"
                            style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Forgot
                            Password?</a>
                    </div>
                </div>

                <button id="loginBtn" type="submit" class="btn btn-primary btn-block">
                    Login
                </button>
            </form>

            <div class="oauth-divider"><span>Or continue with</span></div>

            <div class="oauth-buttons">
                <a href="http://127.0.0.1:8000/auth/oauth/login/google" class="oauth-btn google">
                    <span class="oauth-icon">🔍</span> Google
                </a>
                <a href="http://127.0.0.1:8000/auth/oauth/login/github" class="oauth-btn github">
                    <span class="oauth-icon">🐙</span> GitHub
                </a>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up here</a></p>
            </div>
        </div>

        <!-- MFA Verification Form (Hidden by default) -->
        <div class="auth-box" id="mfaBox" style="display: none;">
            <div class="auth-header">
                <div class="logo">🛡️</div>
                <h1>Two-Factor Auth</h1>
                <p>Enter the 6-digit code from your authenticator app</p>
            </div>
            <form id="mfaForm" class="auth-form" action="javascript:void(0)">
                <div class="form-group">
                    <label for="mfaCode">Authenticator Code</label>
                    <input type="text" id="mfaCode" name="mfaCode" placeholder="123456" required
                        autocomplete="one-time-code" maxlength="6"
                        style="text-align:center; font-size:1.5rem; letter-spacing:0.2em; font-family:monospace;" />
                </div>
                <button id="mfaBtn" type="submit" class="btn btn-primary btn-block">Verify</button>
            </form>
            <div class="auth-footer">
                <p><a href="#" id="cancelMfaBtn">Cancel Login</a></p>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/api.js?v=6"></script>
    <script src="js/ui.js?v=6"></script>
    <script src="js/auth.js?v=6"></script>

    <script>
        window.addEventListener("load", async function () {
            // Eye toggle
            document.getElementById("togglePassword").addEventListener("click", function () {
                var pwd = document.getElementById("password");
                if (pwd.type === "password") {
                    pwd.type = "text";
                    this.textContent = "🙈";
                } else {
                    pwd.type = "password";
                    this.textContent = "👁️";
                }
            });

            let tempMfaToken = null;
            let tempMfaEmail = null;

            // Handle OAuth callback (?token=... in URL set by backend)
            var wasOAuth = await Auth.handleOAuthCallback();
            if (wasOAuth === true) return; // successful oauth login, redirecting

            if (wasOAuth && wasOAuth.mfa_required) {
                tempMfaToken = wasOAuth.temp_token;
                tempMfaEmail = wasOAuth.email;
                document.querySelector('.auth-box').style.display = 'none';
                document.getElementById('mfaBox').style.display = 'block';
                document.getElementById('mfaCode').focus();
                // do NOT return here, we need the mfaForm listener below to be registered
            }

            document.getElementById("loginForm").addEventListener("submit", async function (e) {
                e.preventDefault();
                var email = document.getElementById("email").value.trim();
                var password = document.getElementById("password").value;
                var btn = document.getElementById("loginBtn");
                btn.disabled = true;
                btn.textContent = "Logging in...";
                try {
                    var res = await Auth.login(email, password);
                    if (res && res.mfa_required) {
                        tempMfaToken = res.temp_token;
                        tempMfaEmail = email;
                        document.querySelector('.auth-box').style.display = 'none';
                        document.getElementById('mfaBox').style.display = 'block';
                        document.getElementById('mfaCode').focus();
                    }
                } catch (err) {
                    // errors handled inside Auth.login
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Login";
                }
            });

            // Handle MFA form
            document.getElementById("mfaForm").addEventListener("submit", async function (e) {
                e.preventDefault();
                var code = document.getElementById("mfaCode").value.trim();
                var btn = document.getElementById("mfaBtn");
                btn.disabled = true;
                btn.textContent = "Verifying...";

                try {
                    // Temporarily set the token in localStorage so API.request can use it
                    localStorage.setItem('token', tempMfaToken);

                    const res = await API.request('POST', '/auth/mfa/verify', { code: code });

                    if (res && res.access_token) {
                        Auth.finishLogin(res.access_token, res.user);
                    } else {
                        UI.showError("Failed to verify MFA code.");
                    }
                } catch (err) {
                    UI.showError(err.data ? (err.data.detail || "Invalid MFA code.") : "Invalid MFA code.");
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Verify";
                    // If we failed, the token is technically still in localStorage but it's not fully verified.
                    // Auth.finishLogin handles overwriting it and redirecting on success.
                }
            });

            document.getElementById("cancelMfaBtn").addEventListener("click", function (e) {
                e.preventDefault();
                tempMfaToken = null;
                tempMfaEmail = null;
                localStorage.removeItem('token');
                document.getElementById('mfaCode').value = '';
                document.getElementById('mfaBox').style.display = 'none';
                document.querySelector('.auth-box').style.display = 'block';
            });
        });
    </script>
</body>

</html>
