<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sign in — Zero Trust Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem("token");if(!t)return;var p=t.split(".");if(p.length!==3)return;var b=p[1].replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(p[1].length/4)*4,"=");var pl=JSON.parse(atob(b));if(!pl.exp||Date.now()<pl.exp*1000)window.location.replace("dashboard.html");}catch(e){}})();</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <canvas id="bg-canvas" class="scene-canvas"></canvas>
  <div class="page-wrap">
    <div class="centered-wrap">
      <div class="auth-card panel">

        <div class="auth-header" style="text-align:center;margin-bottom:28px">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <h1 style="font-size:1.4rem;font-weight:700;margin-top:12px">Sign in</h1>
          <p style="color:var(--muted);font-size:0.875rem;margin-top:6px">Zero Trust API Gateway</p>
        </div>

        <!-- Alert banner (shown inline within the card) -->
        <div
          id="alertBanner"
          class="alert-banner"
          style="position:relative;top:auto;right:auto;z-index:auto;width:100%;max-width:100%;margin:0 0 12px;animation:none;display:none"
          role="alert"
          aria-live="polite"
        ></div>

        <!-- Email / Password form -->
        <form class="form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="you@company.com"
              autocomplete="email"
              required
            >
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                <!-- SVG injected by login.js -->
              </button>
            </div>
          </div>
          <div class="flex-between" style="margin-top:-4px">
            <span></span>
            <a href="forgot-password.html" style="font-size:0.8rem;color:var(--muted)">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign in</button>
        </form>

        <!-- MFA section (shown after mfa_required) -->
        <div id="mfaSection" style="display:none">
          <p style="font-size:0.875rem;color:var(--muted);margin-bottom:16px;text-align:center">
            Enter your 6-digit authenticator code
          </p>
          <input
            class="form-input totp-input"
            type="text"
            id="mfaCode"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            placeholder="000000"
            autocomplete="one-time-code"
          >
          <button class="btn btn-primary btn-full mt-16" id="mfaBtn">Verify</button>
          <button class="btn btn-dim btn-full mt-8" id="cancelMfaBtn" style="font-size:0.8rem">
            Back to sign in
          </button>
        </div>

        <!-- OAuth separator + buttons -->
        <div id="oauthSection">
          <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
            <div class="divider" style="flex:1;margin:0"></div>
            <span style="font-size:0.75rem;color:var(--dim);white-space:nowrap">or continue with</span>
            <div class="divider" style="flex:1;margin:0"></div>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px">
            <a href="/auth/oauth/login/google" class="btn btn-ghost btn-full" id="googleBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Continue with Google
            </a>
            <a href="/auth/oauth/login/github" class="btn btn-ghost btn-full" id="githubBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
              Continue with GitHub
            </a>
          </div>
        </div>

        <p style="text-align:center;margin-top:20px;font-size:0.8rem;color:var(--dim)">
          No account? <a href="register.html">Create one</a>
        </p>

      </div>
    </div>
  </div>

  <script src="js/api.js?v=20260815b"></script>
  <script src="js/auth.js?v=20260815b"></script>
  <script type="module" src="js/pages/login.js?v=20260815b"></script>
</body>
</html>
