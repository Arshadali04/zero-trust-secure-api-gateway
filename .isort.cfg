# isort configuration.
#
# CI runs `isort --check-only --diff gateway/ tests/` with no arguments, so it
# reads this file. Defaults would wrap at 79 columns and fight the 120 that
# ruff.toml sets, so the width is pinned here to match.
#
# multi_line_output=3 is the hanging-indent style black also produces, which
# keeps this from conflicting with the formatter.

[settings]
line_length = 120
multi_line_output = 3
include_trailing_comma = True
known_first_party = gateway,tests
skip = venv,.venv,_trash,migrations,data,node_modules,__pycache__
